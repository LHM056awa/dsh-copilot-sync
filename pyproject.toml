[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-copilot-sync"
version = "0.1.0"
description = "Offline tool that syncs dsh/ model lists into VS Code Copilot BYOK chatLanguageModels.json by matching same-named endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["vscode", "copilot", "chat", "language-models", "byok", "dsh", "sync"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["PyYAML>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dsh-sync = "dsh_copilot_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
